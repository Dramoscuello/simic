services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: simic_postgres
    environment:
      POSTGRES_USER: ${USER_POSTGRES:-simic}
      POSTGRES_PASSWORD: ${PASS_POSTGRES:-cambia_esta_password}
      POSTGRES_DB: ${DB_POSTGRES:-simic_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_POSTGRES:-simic} -d ${DB_POSTGRES:-simic_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - simic_net

  redis:
    image: redis:7-alpine
    container_name: simic_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - simic_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simic_backend
    env_file:
      - .env
    environment:
      - HOST_POSTGRES=postgres
      - PORT_POSTGRES=5432
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - chroma_db:/app/data/chroma_db
      - backend_logs:/var/log/SIMIC
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - simic_net

  frontend:
    build:
      context: ./frontend/vue-project
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: simic_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - simic_net

volumes:
  postgres_data:
  redis_data:
  chroma_db:
  backend_logs:

networks:
  simic_net:
    driver: bridge
